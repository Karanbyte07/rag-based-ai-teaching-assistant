services:
  backend:
    container_name: rag-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ../envs/rag.backend.prod.env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - rag_backend_data:/app/data
      - rag_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  rag_backend_data:
  rag_hf_cache:
