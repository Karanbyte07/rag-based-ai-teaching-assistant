services:
  bgutil-provider:
    container_name: bgutil-provider
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  backend:
    container_name: rag-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ../envs/rag.backend.prod.env
    environment:
      PORT: "8000"
      YTDLP_COOKIE_FILE: "/app/host_data/cookies.txt"
      YTDLP_USE_BGUTIL: "true"
      YTDLP_BGUTIL_BASE_URL: "http://bgutil-provider:4416"
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    volumes:
      - rag_backend_data:/app/data
      - rag_hf_cache:/root/.cache/huggingface
      - ./backend/data:/app/host_data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  rag_backend_data:
  rag_hf_cache:
